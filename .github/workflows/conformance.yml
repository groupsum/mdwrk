name: Conformance

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: Verify renderer corpus and profiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run ci:install
      - run: npm run build --workspace @mdwrk/markdown-renderer-core
      - run: npm test --workspace @mdwrk/markdown-renderer-core
