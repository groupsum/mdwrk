body: |-
  # MdWrk Editor Command Focus Contract
  
  ## Purpose
  This specification defines focus, selection, and command-integrity requirements for MdWrk editor packages.
  
  ## Scope
  The contract applies to `@mdwrk/markdown-editor-core`, `@mdwrk/markdown-editor-react`, and `@mdwrk/markdown-edit-in-renderer-react`.
  
  ## Requirements
  1. Toolbar controls shall dispatch package commands instead of applying ad hoc DOM or React mutations.
  2. Checkbox insertion and checkbox completion shall create only the checkbox marker changes required by the command, preserve line and character focus, avoid jumping to the top of the document, preserve scroll continuity, and place the cursor at the expected content offset.
  3. Checkbox toolbar activation shall not trigger italic state.
  4. Italic, underline, link, image, ordered-list, unordered-list, checklist, reorder, and indentation commands shall have isolated transforms and tests.
  5. Multi-word selection shall be preserved through command dispatch where the command semantics require it.
  6. Line-count bars shall align with editor content during vertical scroll.
  7. Rendered-flow editing shall preserve preview/editor parity, inline image behavior, text wrapping, touch selection expansion, and keyboard focus.
  8. Palette-dispatched editor commands shall preserve the same focus and selection guarantees as toolbar dispatch.
  
  ## Verification
  Passing evidence shall include editor-core transform tests, editor-react focus and toolbar tests, touch-selection tests, command-palette tests, edit-in-renderer parity tests, and app-level smoke coverage for affected flows.
