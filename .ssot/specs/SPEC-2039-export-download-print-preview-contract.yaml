body: |-
  # SPEC-2039: Export, Download, Print, And Preview Contract
  
  ## Requirements
  
  Preview, markdown export, HTML export, PDF artifact preparation, print, and generated reporting surfaces must be reachable through governed package commands, React handles, or views. Generated artifacts are derived outputs and must not become canonical workspace state unless explicitly imported.
  
  ## Evidence
  
  Evidence must cover preview reachability, markdown export reachability, HTML export reachability, PDF artifact preparation, print behavior where testable, artifact naming, failure states, and command accessibility.
