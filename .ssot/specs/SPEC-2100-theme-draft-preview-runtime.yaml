body: |-
  # Theme Draft And Preview Runtime
  
  ## Purpose
  This specification defines the shared runtime behavior for editable theme drafts and contract-aware preview application.
  
  ## Scope
  The contract applies to `@mdwrk/theme-draft`, `@mdwrk/theme-preview`, and any package that consumes their outputs, including `@mdwrk/extension-theme-studio`.
  
  ## Requirements
  1. Theme drafts shall remain compatible with `@mdwrk/theme-contract` token names and draft-compatible structures.
  2. Draft editing shall support patch-style updates, token unsets, cloning, and deterministic resolution against contract defaults.
  3. Draft history shall support snapshot capture plus undo and redo without mutating prior snapshots.
  4. Preview application shall render host CSS custom properties and editor/renderer bridge variables from the same draft inputs.
  5. Preview runtime helpers shall expose deterministic CSS text generation and direct style-application helpers.
  6. Preview runtime helpers shall support multi-surface preview of host, editor, and renderer contexts without redefining the token contract.
  7. Theme Studio shall consume the shared draft and preview packages instead of duplicating the same behaviors inside the extension package.
  
  ## Verification
  Passing evidence shall include package-local T0, T1, and T2 coverage for draft patching and history, contract-valid token resolution, bridge CSS generation, and preview application helpers.
