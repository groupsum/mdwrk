body: |-
  # SPEC-2040: Export Profile Disclosure Contract
  
  ## Requirements
  
  Preview and export surfaces must disclose active CM, GFM, and CFM parser and previewer profiles whenever profile selection can affect output. Command and operator surfaces that claim conformance or generated artifact fidelity must also disclose whether a behavior is CommonMark, GFM, CFM, or MdWrk-operator specific.
  
  ## Evidence
  
  Evidence must cover profile selection, preview disclosure, export disclosure, command inventory disclosure, conformance reports, and failure labeling by parser, renderer, preview, export, or adapter boundary.
