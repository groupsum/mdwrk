body: |-
  # Context
  Editor toolbar and command work includes checkbox insertion, checkbox completion, italic isolation, focus retention, selection preservation, link conversion, image source editing, ordered and unordered list behavior, line and block reordering, line-count alignment, touch selection expansion, and rendered-flow editing. These behaviors are easy to break when toolbar buttons mutate DOM or React state directly.
  
  # Decision
  Editor commands must preserve focus, selection, insertion semantics, and scroll continuity through package-owned command contracts. `@mdwrk/markdown-editor-core` owns source-mode transforms, reorder semantics, navigation intents, and command state. `@mdwrk/markdown-editor-react` owns React toolbar dispatch, keyboard wiring, palette projection, and textarea focus integration. `@mdwrk/markdown-edit-in-renderer-react` owns rendered-flow editing parity. Toolbar and palette controls dispatch commands; they do not implement independent mutations.
  
  # Boundaries
  This decision does not prescribe one UI for every editor surface. It requires each UI to use the package command contracts and to prove focus or selection behavior through tests. Renderer packages own rendering and preview output; editor packages own authoring mutations.
  
  # Consequences
  Checkbox, list, reorder, link, image, touch-selection, and line-alignment behavior can be tested at the correct package boundary. App-level regressions can be traced back to command dispatch, command transforms, keyboard adapters, or rendered-flow integration.
