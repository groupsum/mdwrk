body: |-
  ## Decision
  
  # ADR-0004: theme token and class contract
  
  - Status: Accepted
  - Date: 2026-03-20
  
  Define a formal token and semantic class contract for renderer/editor/extension packages.
  Packages must target the contract rather than importing app-local stylesheets.
  Shared package ownership is limited to markdown, editor, previewer, and renderer token surfaces plus their semantic class hooks. Shared packages shall not ship browser body, application chassis, rail, header, footer, pane, or host-shell token defaults.
  
  Downstream applications may implement the shared package contract, but they keep ownership of their own shell token bands. `mdwrk-studio` owns the app-shell token implementation. `mdwrk-pages` implements the shared markdown-facing contract for public lander surfaces and may extend it with pages-only token names. Downstream product hosts such as mdwrkcom consume those token surfaces rather than redefining package ownership.
  
  ## Context
  
  The current client already has a CSS variable and markdown class naming system, but it is implicit and app-local.
  
  As the package family split across `mdwrk`, `mdwrk-studio`, `mdwrk-pages`, and downstream hosts, token ownership also needs an explicit boundary. Without that split, package CSS can quietly grow app-shell defaults, Studio can shadow package token definitions, and Pages or product hosts can reintroduce app-local token authorities that bypass the contract.
