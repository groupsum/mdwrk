server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
  add_header Pragma "no-cache" always;
  add_header Expires "0" always;

  location = /healthz {
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location = / {
    try_files /index.html =404;
  }

  location /renderer-basic/assets/ {
    proxy_pass http://mdwrk-renderer-basic/assets/;
    proxy_set_header Host $host;
  }

  location /renderer-basic/ {
    proxy_pass http://mdwrk-renderer-basic/;
    proxy_set_header Host $host;
    sub_filter_once off;
    sub_filter_types text/html;
    sub_filter 'src="/assets/' 'src="/renderer-basic/assets/';
    sub_filter 'href="/assets/' 'href="/renderer-basic/assets/';
  }

  location /editor-basic/assets/ {
    proxy_pass http://mdwrk-editor-basic/assets/;
    proxy_set_header Host $host;
  }

  location /editor-basic/ {
    proxy_pass http://mdwrk-editor-basic/;
    proxy_set_header Host $host;
    sub_filter_once off;
    sub_filter_types text/html;
    sub_filter 'src="/assets/' 'src="/editor-basic/assets/';
    sub_filter 'href="/assets/' 'href="/editor-basic/assets/';
  }

  location /editor-demo/assets/ {
    proxy_pass http://mdwrk-editor-demo/assets/;
    proxy_set_header Host $host;
  }

  location /editor-demo/ {
    proxy_pass http://mdwrk-editor-demo/;
    proxy_set_header Host $host;
    sub_filter_once off;
    sub_filter_types text/html;
    sub_filter 'src="/assets/' 'src="/editor-demo/assets/';
    sub_filter 'href="/assets/' 'href="/editor-demo/assets/';
  }

  location /previewer-demo/assets/ {
    proxy_pass http://mdwrk-previewer-demo/assets/;
    proxy_set_header Host $host;
  }

  location /previewer-demo/ {
    proxy_pass http://mdwrk-previewer-demo/;
    proxy_set_header Host $host;
    sub_filter_once off;
    sub_filter_types text/html;
    sub_filter 'src="/assets/' 'src="/previewer-demo/assets/';
    sub_filter 'href="/assets/' 'href="/previewer-demo/assets/';
  }

  location /edit-in-renderer-demo/assets/ {
    proxy_pass http://mdwrk-edit-in-renderer-demo/assets/;
    proxy_set_header Host $host;
  }

  location /edit-in-renderer-demo/ {
    proxy_pass http://mdwrk-edit-in-renderer-demo/;
    proxy_set_header Host $host;
    sub_filter_once off;
    sub_filter_types text/html;
    sub_filter 'src="/assets/' 'src="/edit-in-renderer-demo/assets/';
    sub_filter 'href="/assets/' 'href="/edit-in-renderer-demo/assets/';
  }

  location /ui-tokens-demo/assets/ {
    proxy_pass http://mdwrk-ui-tokens-demo/assets/;
    proxy_set_header Host $host;
  }

  location /ui-tokens-demo/ {
    proxy_pass http://mdwrk-ui-tokens-demo/;
    proxy_set_header Host $host;
    sub_filter_once off;
    sub_filter_types text/html;
    sub_filter 'src="/assets/' 'src="/ui-tokens-demo/assets/';
    sub_filter 'href="/assets/' 'href="/ui-tokens-demo/assets/';
  }
}
