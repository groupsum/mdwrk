services:
  renderer-basic:
    build:
      context: ./examples/renderer-basic
      dockerfile: Dockerfile
    container_name: mdwrk-renderer-basic
    ports:
      - "127.0.0.1:4300:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/healthz | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  editor-basic:
